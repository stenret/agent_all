<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎫 智能演出购票助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
  --accent:#6366f1; --accent2:#8b5cf6; --text:#e2e8f0;
  --text2:#94a3b8; --success:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --radius:12px;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex}
/* Sidebar */
.sidebar{
  width:280px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-header{
  padding:20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sidebar-header .logo{font-size:28px}
.sidebar-header h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:8px;cursor:pointer;color:var(--text2);transition:all .15s;
  margin-bottom:2px;font-size:14px;
}
.nav-item:hover{background:#252836;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
.sidebar-footer{
  padding:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text2);text-align:center;
}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:6px}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{
  padding:16px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.header h2{font-size:18px;font-weight:600}
.header .model-badge{
  background:#252836;color:var(--text2);padding:4px 12px;
  border-radius:20px;font-size:12px;
}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Chat Panel */
.chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg .avatar{
  width:36px;height:36px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.msg.user .avatar{background:var(--accent)}
.msg.assistant .avatar{background:#252836}
.msg .bubble{
  padding:12px 16px;border-radius:var(--radius);font-size:14px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.msg.user .bubble{background:var(--accent);border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--card);border-bottom-left-radius:4px;border:1px solid var(--border)}
.msg .meta{font-size:11px;color:var(--text2);margin-top:4px}

/* Input */
.input-area{padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.input-row{display:flex;gap:10px}
.input-row input{
  flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;
}
.input-row input:focus{border-color:var(--accent)}
.input-row button{
  padding:12px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:var(--radius);color:#fff;font-size:14px;
  font-weight:600;cursor:pointer;transition:opacity .15s;
}
.input-row button:hover{opacity:.9}
.input-row button:disabled{opacity:.5;cursor:not-allowed}
.quick-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick-btn{
  padding:6px 14px;background:#252836;border:1px solid var(--border);
  border-radius:20px;color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .15s;
}
.quick-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Shows Panel */
.shows-panel{padding:20px 24px;overflow-y:auto;display:none}
.shows-panel.active{display:block}
.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-bar select,.search-bar input{
  padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none;
}
.search-bar input{flex:1;min-width:200px}
.search-bar select:focus,.search-bar input:focus{border-color:var(--accent)}
.search-bar button{
  padding:10px 20px;background:var(--accent);border:none;border-radius:8px;
  color:#fff;cursor:pointer;font-weight:600;
}
.show-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:all .2s;cursor:pointer;
}
.show-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.show-card-body{padding:16px}
.show-card-body h3{font-size:15px;margin:8px 0 6px;line-height:1.4}
.show-card .show-meta{
  display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:4px 0 8px;
}
.show-card .show-meta span{display:flex;align-items:center;gap:4px}
.show-card-footer{
  display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:10px;
  border-top:1px solid var(--border);
}
.show-card .show-price{font-size:20px;font-weight:700;color:var(--accent2)}
.show-card .show-stock{
  display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:8px;
  vertical-align:middle;
}
.show-stock.available{background:#22c55e18;color:var(--success)}
.show-stock.low{background:#f59e0b18;color:var(--warn)}
.show-stock.soldout{background:#ef444418;color:var(--danger)}

/* Orders Panel */
.orders-panel{padding:20px 24px;overflow-y:auto;display:none}
.orders-panel.active{display:block}
.order-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
}
.order-card .order-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
}
.order-id{font-family:monospace;color:var(--accent);font-size:13px}
.order-status{
  padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;
}
.order-status.paid{background:#22c55e22;color:var(--success)}
.order-status.locked{background:#f59e0b22;color:var(--warn)}
.order-status.refunded{background:#94a3b822;color:var(--text2)}

/* Loading */
.typing{display:flex;gap:4px;padding:12px 16px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--text2);animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:3px}

.type-badge{font-size:11px;padding:2px 8px;border-radius:10px}
.type-演唱会{background:#ef444422;color:#ef4444}
.type-话剧{background:#8b5cf622;color:#8b5cf6}
.type-音乐剧{background:#f59e0b22;color:#f59e0b}
.type-音乐会{background:#22c55e22;color:#22c55e}
.type-脱口秀{background:#06b6d422;color:#06b6d4}
.type-展览{background:#ec489922;color:#ec4899}
.type-体育{background:#f9731622;color:#f97316}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">🎫</span>
    <h1>智能演出购票</h1>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-panel="chat">
      <span class="icon">💬</span> 智能对话
    </div>
    <div class="nav-item" data-panel="shows">
      <span class="icon">🔍</span> 演出搜索
    </div>
    <div class="nav-item" data-panel="orders">
      <span class="icon">📋</span> 我的订单
    </div>
    <div class="nav-item" onclick="newChat()" style="margin-top:12px;border-top:1px solid var(--border);padding-top:14px;color:var(--accent)">
      <span class="icon">✨</span> 新对话
    </div>
  </nav>
  <div class="sidebar-footer">
    <span class="status-dot"></span> Agent Harness (ETCSLV) v3.0
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="header">
    <h2 id="panelTitle">💬 智能对话</h2>
    <span class="model-badge" id="modelBadge">DeepSeek</span>
  </div>
  <div class="content">
    <!-- Chat Panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="messages" id="messages">
        <div class="msg assistant">
          <div class="avatar">🤖</div>
          <div>
            <div class="bubble">你好！我是智能演出购票助手 🎫<br><br>我可以帮你：<br>🔍 <b>搜索演出</b> — 按城市、类型、日期<br>🎫 <b>购买门票</b> — 选座、下单、支付<br>📋 <b>订单管理</b> — 查询、退票<br><br>试试说：<i>"找一下北京7月的演唱会"</i></div>
          </div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <input type="text" id="chatInput" placeholder="输入你想看的演出..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickSend('找一下北京的演唱会')">🎵 北京演唱会</button>
          <button class="quick-btn" onclick="quickSend('找一下上海的话剧')">🎭 上海话剧</button>
          <button class="quick-btn" onclick="quickSend('有什么脱口秀可以看')">🎙 脱口秀</button>
          <button class="quick-btn" onclick="quickSend('帮我查一下我的订单')">📋 查订单</button>
        </div>
      </div>
    </div>

    <!-- Shows Panel -->
    <div class="shows-panel" id="showsPanel">
      <div class="search-bar">
        <input type="text" id="showKeyword" placeholder="搜索演出名称...">
        <select id="showType"><option value="">全部类型</option><option>演唱会</option><option>话剧</option><option>音乐剧</option><option>音乐会</option><option>脱口秀</option><option>展览</option><option>体育</option></select>
        <select id="showCity"><option value="">全部城市</option><option>北京</option><option>上海</option><option>广州</option><option>深圳</option><option>成都</option><option>杭州</option></select>
        <button onclick="searchShows()">搜索</button>
      </div>
      <div id="showResults"></div>
    </div>

    <!-- Orders Panel -->
    <div class="orders-panel" id="ordersPanel">
      <div style="margin-bottom:16px">
        <input type="text" id="orderQueryInput" placeholder="输入订单号或会话ID查询..." style="padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);width:300px;margin-right:10px">
        <button onclick="queryOrders()" style="padding:10px 20px;background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer">查询</button>
      </div>
      <div id="orderResults"></div>
    </div>
  </div>
</main>

<script>
const API = '';
let sessionId = 'web-' + Date.now();

// 新对话：重置 session，清空聊天记录
function newChat() {
  sessionId = 'web-' + Date.now();
  document.getElementById('messages').innerHTML = `
    <div class="msg assistant">
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble">你好！我是智能演出购票助手 🎫<br><br>我可以帮你：<br>🔍 <b>搜索演出</b> — 按城市、类型、日期<br>🎫 <b>购买门票</b> — 选座、下单、支付<br>📋 <b>订单管理</b> — 查询、退票<br>📚 <b>知识问答</b> — 场馆攻略、购票须知<br><br>试试说：<i>"搜索周杰伦演唱会，帮我订一张最便宜的票"</i></div>
      </div>
    </div>`;
  // 切换到对话面板
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector('[data-panel="chat"]').classList.add('active');
  document.getElementById('chatPanel').style.display = 'flex';
  document.getElementById('showsPanel').classList.remove('active');
  document.getElementById('ordersPanel').classList.remove('active');
  document.getElementById('panelTitle').textContent = '💬 智能对话';
  currentPanel = 'chat';
}
let currentPanel = 'chat';

// Navigation
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentPanel = item.dataset.panel;
    document.getElementById('chatPanel').style.display = currentPanel === 'chat' ? 'flex' : 'none';
    document.getElementById('showsPanel').classList.toggle('active', currentPanel === 'shows');
    document.getElementById('ordersPanel').classList.toggle('active', currentPanel === 'orders');
    document.getElementById('panelTitle').textContent = 
      currentPanel === 'chat' ? '💬 智能对话' : currentPanel === 'shows' ? '🔍 演出搜索' : '📋 我的订单';
  });
});

// Chat
function addMessage(role, content, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div>
      <div class="bubble">${content}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
    </div>`;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>`;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  
  addMessage('user', msg);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addTyping();

  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: msg})
    });
    const d = await r.json();
    removeTyping();
    const meta = `${d.steps}步 · ${(d.elapsed_ms/1000).toFixed(1)}s · eval:${d.evaluation?.success ?? '?'}`;
    addMessage('assistant', d.reply, meta);
  } catch(e) {
    removeTyping();
    addMessage('assistant', '网络错误: ' + e.message);
  }
  document.getElementById('sendBtn').disabled = false;
}

function quickSend(msg) {
  document.getElementById('chatInput').value = msg;
  sendMessage();
}

// Shows
function parseShowResults(raw) {
  const lines = raw.split('\n');
  const shows = [];
  let current = null;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    // Match: "1. 【展览】《千里江山图》沉浸式数字艺术展"
    const headMatch = trimmed.match(/^\d+\.\s*【(.+?)】(.+)$/);
    if (headMatch) {
      if (current) shows.push(current);
      current = { type: headMatch[1], name: headMatch[2], venue: '', date: '', time: '', prices: [], stock: '', stockText: '', stockCount: 0, desc: '', id: '' };
      continue;
    }
    if (!current) continue;
    // Venue + date + time
    const vdMatch = trimmed.match(/🏟\s*(.+?)\s*\|\s*📅\s*(\d{4}-\d{2}-\d{2})\s*(\d{2}:\d{2})/);
    if (vdMatch) { current.venue = vdMatch[1].trim(); current.date = vdMatch[2]; current.time = vdMatch[3]; continue; }
    // Prices + stock
    const prMatch = trimmed.match(/💰\s*(.+?)\s*\|\s*🎫\s*(.+)/);
    if (prMatch) {
      current.prices = prMatch[1].split('/').map(s => s.replace(/[¥\s]/g,'').trim()).filter(Boolean);
      const stockPart = prMatch[2];
      const stMatch = stockPart.match(/([🟢🟡🔴])\s*(.+?)\(余(\d+)张\)/);
      if (stMatch) { current.stock = stMatch[1]; current.stockText = stMatch[2]; current.stockCount = parseInt(stMatch[3]); }
      continue;
    }
    // Description
    const descMatch = trimmed.match(/📝\s*(.+)/);
    if (descMatch) { current.desc = descMatch[1].replace(/\.\.\.$/,''); continue; }
    // ID
    const idMatch = trimmed.match(/🆔\s*演出ID:\s*(\S+)/);
    if (idMatch) { current.id = idMatch[1]; continue; }
  }
  if (current) shows.push(current);
  return shows;
}

function renderShowCard(s) {
  const typeClass = 'type-' + s.type;
  const stockClass = s.stockCount > 50 ? 'available' : (s.stockCount > 0 ? 'low' : 'soldout');
  const priceStr = s.prices.length ? s.prices.map(p => '¥' + p).join(' / ') : '';
  const minPrice = s.prices.length ? '¥' + s.prices[0] + '起' : '';
  return `
    <div class="show-card" onclick="document.getElementById('chatInput').value='查看演出${s.id}的详情';document.querySelector('[data-panel=chat]').click()">
      <div class="show-card-body">
        <span class="type-badge ${typeClass}">${s.type}</span>
        <span class="show-stock ${stockClass}">${s.stock} ${s.stockText}(余${s.stockCount}张)</span>
        <h3>${s.name}</h3>
        <div class="show-meta">
          <span>🏟 ${s.venue}</span>
          <span>📅 ${s.date} ${s.time}</span>
        </div>
        <div class="show-card-footer">
          <span class="show-price">${minPrice}</span>
          <span style="color:var(--text2);font-size:12px">${priceStr}</span>
          <span style="margin-left:auto;color:var(--text2);font-size:11px">🆔 ${s.id}</span>
        </div>
        ${s.desc ? `<p style="margin-top:8px;font-size:12px;color:var(--text2);line-height:1.5">📝 ${s.desc}</p>` : ''}
      </div>
    </div>`;
}

async function searchShows() {
  const keyword = document.getElementById('showKeyword').value;
  const show_type = document.getElementById('showType').value;
  const city = document.getElementById('showCity').value;
  const results = document.getElementById('showResults');
  results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">🔍 搜索中...</div>';
  
  try {
    const r = await fetch(API + '/shows/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({keyword, show_type, city, limit: 20})
    });
    const d = await r.json();
    const shows = parseShowResults(d.result);
    if (!shows.length) {
      results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">😕 未找到匹配的演出，换个条件试试</div>';
      return;
    }
    results.innerHTML = `
      <div style="margin-bottom:12px;font-size:13px;color:var(--text2)">找到 <b style="color:var(--accent)">${shows.length}</b> 场演出</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px">
        ${shows.map(renderShowCard).join('')}
      </div>`;
  } catch(e) {
    results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger)">搜索失败: ' + e.message + '</div>';
  }
}

// Orders
async function queryOrders() {
  const q = document.getElementById('orderQueryInput').value.trim();
  const isOrderId = q.toUpperCase().startsWith('ORD-');
  
  try {
    const r = await fetch(API + '/orders/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(isOrderId ? {order_id: q} : {session_id: q || sessionId})
    });
    const d = await r.json();
    document.getElementById('orderResults').innerHTML = '<pre style="white-space:pre-wrap;font-size:14px">' + d.result + '</pre>';
  } catch(e) {
    document.getElementById('orderResults').innerHTML = '查询失败: ' + e.message;
  }
}

// Load model info
fetch(API + '/health').then(r => r.json()).then(d => {
  document.getElementById('modelBadge').textContent = d.model || 'DeepSeek';
});

// Initial load
searchShows();
</script>
</body>
</html>
